name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Check output
        shell: pwsh
        run: |
          $dll = "build/Release/better-automap.dll"
          if (-not (Test-Path $dll)) { throw "missing $dll" }
          Copy-Item better-automap.toml build/Release/
          Get-Item $dll | Format-List Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: better-automap
          path: |
            build/Release/better-automap.dll
            build/Release/better-automap.toml
            README.md
          if-no-files-found: error
