# Better Auras config: <game>\d2rloader\config\better-auras.toml. D2RLoader writes these defaults on the plugin's
# first start; edit the file there and restart the game after every change. It applies to every mod.
#
# Only skills listed under [skills.<name or id>] are changed; every other skill stays vanilla. A listed skill starts
# from [defaults] and overrides what it sets. Names are skills.txt "skill" names (the mod's own skills.txt when it
# ships as loose files, else D2R's aura names); ids always work: [skills.98].
#
#   enabled = true|false        false: the skill stays vanilla
#   toggle  = true|false        true: the trigger turns the aura on/off and it stays on whatever skill is selected;
#                               false: vanilla (on while it is the right skill); drain and reserve still apply
#   trigger = "select"|"cast"   "select": choosing the skill for the right button toggles it (choose it again to turn
#                               it off); "cast": using the skill toggles it
#   drain   = { resource = "mana"|"life", perSecond = <number> }      stops the aura when the pool can't pay
#   reserve = { resource = "mana"|"life", mode = "percent"|"flat", value = <number> }
#                               caps current life/mana at max - reserved; refused when the pool can't cover it

[defaults]
enabled = true
toggle = true
trigger = "select"

[skills.Might]
reserve = { resource = "mana", mode = "percent", value = 25 }

[skills.Prayer]
drain = { resource = "mana", perSecond = 1.5 }

[skills.Concentration]
reserve = { resource = "mana", mode = "percent", value = 35 }

[skills.Vigor]
reserve = { resource = "life", mode = "flat", value = 20 }

[skills.Conviction]
reserve = { resource = "mana", mode = "percent", value = 50 }
drain = { resource = "mana", perSecond = 2 }
