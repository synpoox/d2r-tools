name: release
# Publishes a suite release (release\suite.json): per-plugin zips, a bundle, SHA256SUMS.txt and player-facing notes.
# Run it by hand (Actions > release > Run workflow) after tagging each plugin release <plugin>/vX.Y.Z; see docs/RELEASING.md.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Suite tag (release-YYYY.MM.DD.N); empty = today, next free number'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $r = ./tools/release.ps1 -Suite '${{ inputs.suite }}'
          $r = $r | Select-Object -Last 1
          gh release create $r.Tag @($r.Assets) --title $r.Title --notes-file $r.Notes --target $env:GITHUB_SHA --latest
          if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }
