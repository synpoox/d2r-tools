name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.list.outputs.plugins }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "plugins=$(ls plugins | jq -R -s -c 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJson(needs.discover.outputs.plugins) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build ${{ matrix.plugin }}
        shell: pwsh
        run: ./tools/build.ps1 -Plugin '${{ matrix.plugin }}'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.plugin }}
          path: dist/${{ matrix.plugin }}
